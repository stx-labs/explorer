name: Build Docker Image for Explorer

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment name"
        required: true
        default: environment/explorer-staging
        type: choice
        options:
          - environment/explorer-staging
          - environment/explorer-production
  pull_request:
    branches:
      - main

concurrency:
  group: docker-build-explorer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  attestations: write
  issues: read
  pull-requests: read

env:
  docker_platforms: "linux/amd64"

jobs:
  resolve-env:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set_env.outputs.environment }}
      should_run: ${{ steps.set_env.outputs.should_run }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve Environment
        id: set_env
        run: |
          ALLOWED_ENVS=("environment/explorer-staging" "environment/explorer-production")

          is_allowed_env() {
            local candidate="$1"
            for env in "${ALLOWED_ENVS[@]}"; do
              if [ "$candidate" = "$env" ]; then
                return 0
              fi
            done
            return 1
          }

          SHOULD_RUN=true

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "### The workflow_dispatch can only be run on main branch." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

            ENVIRONMENT="${{ github.event.inputs.environment }}"

            if ! is_allowed_env "$ENVIRONMENT"; then
              echo "### Invalid workflow_dispatch environment: $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
              echo "### Allowed environments: ${ALLOWED_ENVS[*]}" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            LABELS=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels --jq '.[].name')

            MATCHED_ENVS=()
            for label in $LABELS; do
              if is_allowed_env "$label"; then
                MATCHED_ENVS+=("$label")
              fi
            done

            if [ "${#MATCHED_ENVS[@]}" -eq 0 ]; then
              echo "### No valid environment label found on PR. Please add one of: ${ALLOWED_ENVS[*]}" >> $GITHUB_STEP_SUMMARY
              SHOULD_RUN=false
            elif [ "${#MATCHED_ENVS[@]}" -gt 1 ]; then
              echo "### Multiple environment labels found: ${MATCHED_ENVS[*]}. Please use only one." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

            ENVIRONMENT="${MATCHED_ENVS[0]}"
          else
            echo "### Unsupported trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

  image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: resolve-env
    if: needs.resolve-env.outputs.should_run == 'true'
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - name: Configure AWS Credentials via OIDC
        id: configure_aws
        uses: stx-labs/actions/aws/configure-aws-credentials@c946e6695d77cbb9a9ede3320e7d2128c71dc090
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr_login
        uses: stx-labs/actions/aws/amazon-ecr-login@c946e6695d77cbb9a9ede3320e7d2128c71dc090

      - name: Checkout Repository
        id: checkout_repository
        uses: stx-labs/actions/checkout@c946e6695d77cbb9a9ede3320e7d2128c71dc090

      - name: Docker Metadata
        id: docker_metadata
        uses: stx-labs/actions/docker/metadata-action@c946e6695d77cbb9a9ede3320e7d2128c71dc090
        with:
          images: |
            ${{ steps.ecr_login.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}
          tags: |
            type=raw,value=explorer-${{ github.sha }}
            type=raw,value=latest,enable=${{ needs.resolve-env.outputs.environment == 'environment/explorer-mainnet' }}

      - name: Build and Push
        id: docker_build
        uses: stx-labs/actions/docker/build-push-action@c946e6695d77cbb9a9ede3320e7d2128c71dc090
        with:
          file: ./Dockerfile
          context: .
          platforms: ${{ env.docker_platforms }}
          tags: ${{ steps.docker_metadata.outputs.tags }}
          labels: ${{ steps.docker_metadata.outputs.labels }}
          push: true
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            RELEASE_TAG_NAME=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}

      - name: Generate artifact attestation
        id: generate_attestation
        uses: stx-labs/actions/attest-build-provenance@c946e6695d77cbb9a9ede3320e7d2128c71dc090
        with:
          subject-name: ${{ steps.ecr_login.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
