name: Build Docker Image for Explorer

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment name"
        required: true
        default: environment/explorer-testnet
        type: choice
        options:
          - environment/explorer-testnet
          - environment/explorer-mainnet
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  attestations: write
  issues: read
  pull-requests: read

env:
  docker_platforms: "linux/amd64"
  image_tag: explorer-${{ github.sha }}

jobs:
  resolve-env:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set_env.outputs.environment }}
      should_run: ${{ steps.set_env.outputs.should_run }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve Environment
        id: set_env
        run: |
          ALLOWED_ENVS=("environment/explorer-testnet" "environment/explorer-mainnet")

          is_allowed_env() {
            local candidate="$1"
            for env in "${ALLOWED_ENVS[@]}"; do
              if [ "$candidate" = "$env" ]; then
                return 0
              fi
            done
            return 1
          }

          SHOULD_RUN=true

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "### The workflow_dispatch can only be run on main branch." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

            ENVIRONMENT="${{ github.event.inputs.environment }}"

            if ! is_allowed_env "$ENVIRONMENT"; then
              echo "### Invalid workflow_dispatch environment: $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
              echo "### Allowed environments: ${ALLOWED_ENVS[*]}" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            LABELS=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels --jq '.[].name')

            MATCHED_ENVS=()
            for label in $LABELS; do
              if is_allowed_env "$label"; then
                MATCHED_ENVS+=("$label")
              fi
            done

            if [ "${#MATCHED_ENVS[@]}" -eq 0 ]; then
              echo "### No valid environment label found on PR. Please add one of: ${ALLOWED_ENVS[*]}" >> $GITHUB_STEP_SUMMARY
              SHOULD_RUN=false
            elif [ "${#MATCHED_ENVS[@]}" -gt 1 ]; then
              echo "### Multiple environment labels found: ${MATCHED_ENVS[*]}. Please use only one." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

            ENVIRONMENT="${MATCHED_ENVS[0]}"
          else
            echo "### Unsupported trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

  image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: resolve-env
    if: needs.resolve-env.outputs.should_run == 'true'
    environment: ${{ needs.resolve-env.outputs.environment }}
    concurrency:
      group: docker-build-explorer-${{ needs.resolve-env.outputs.environment }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Configure AWS Credentials via OIDC
        id: configure_aws
        uses: stx-labs/actions/aws/configure-aws-credentials@c946e6695d77cbb9a9ede3320e7d2128c71dc090
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr_login
        uses: stx-labs/actions/aws/amazon-ecr-login@c946e6695d77cbb9a9ede3320e7d2128c71dc090

      - name: Checkout Repository
        id: checkout_repository
        uses: stx-labs/actions/checkout@c946e6695d77cbb9a9ede3320e7d2128c71dc090

      - name: Docker Metadata
        id: docker_metadata
        uses: stx-labs/actions/docker/metadata-action@c946e6695d77cbb9a9ede3320e7d2128c71dc090
        with:
          images: |
            ${{ steps.ecr_login.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ env.image_tag }}
            type=raw,value=latest,enable=${{ needs.resolve-env.outputs.environment == 'environment/explorer-mainnet' }}

      - name: Build and Push
        id: docker_build
        uses: stx-labs/actions/docker/build-push-action@c946e6695d77cbb9a9ede3320e7d2128c71dc090
        with:
          file: ./Dockerfile
          context: .
          platforms: ${{ env.docker_platforms }}
          tags: ${{ steps.docker_metadata.outputs.tags }}
          labels: ${{ steps.docker_metadata.outputs.labels }}
          push: true
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            RELEASE_TAG_NAME=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            NEXT_PUBLIC_CONNECT_AUTH_ORIGIN=${{ vars.NEXT_PUBLIC_CONNECT_AUTH_ORIGIN }}
            NEXT_PUBLIC_MAINNET_API_SERVER=${{ vars.NEXT_PUBLIC_MAINNET_API_SERVER }}
            NEXT_PUBLIC_MAINNET_BTC_ADDRESS_BASE_URL=${{ vars.NEXT_PUBLIC_MAINNET_BTC_ADDRESS_BASE_URL }}
            NEXT_PUBLIC_MAINNET_BTC_BLOCK_BASE_URL=${{ vars.NEXT_PUBLIC_MAINNET_BTC_BLOCK_BASE_URL }}
            NEXT_PUBLIC_MAINNET_BTC_TX_BASE_URL=${{ vars.NEXT_PUBLIC_MAINNET_BTC_TX_BASE_URL }}
            NEXT_PUBLIC_TESTNET_API_SERVER=${{ vars.NEXT_PUBLIC_TESTNET_API_SERVER }}
            NEXT_PUBLIC_TESTNET_BTC_ADDRESS_BASE_URL=${{ vars.NEXT_PUBLIC_TESTNET_BTC_ADDRESS_BASE_URL }}
            NEXT_PUBLIC_TESTNET_BTC_BLOCK_BASE_URL=${{ vars.NEXT_PUBLIC_TESTNET_BTC_BLOCK_BASE_URL }}
            NEXT_PUBLIC_TESTNET_BTC_TX_BASE_URL=${{ vars.NEXT_PUBLIC_TESTNET_BTC_TX_BASE_URL }}

      - name: Generate artifact attestation
        id: generate_attestation
        uses: stx-labs/actions/attest-build-provenance@c946e6695d77cbb9a9ede3320e7d2128c71dc090
        with:
          # MUST be the untagged repository name. A tagged subject-name fails with
          # "Invalid image name" — an attestation identifies its subject by digest.
          subject-name: ${{ steps.ecr_login.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}

      # Record the tag CI just pushed so a deploy can read it from SSM.
      # Runs last: only move the parameter once the image is pushed AND attested.
      - name: Publish Image Tag to Parameter Store
        id: publish_image_tag
        env:
          PARAMETER_NAME: ${{ vars.AWS_SSM_IMAGE_TAG_PARAMETER }}
          IMAGE_TAG: ${{ env.image_tag }}
        run: |
          set -euo pipefail

          if [ -z "${PARAMETER_NAME}" ]; then
            echo "::error::AWS_SSM_IMAGE_TAG_PARAMETER is not set on this environment; refusing to guess the parameter path."
            exit 1
          fi

          aws ssm put-parameter \
            --name "${PARAMETER_NAME}" \
            --value "${IMAGE_TAG}" \
            --type String \
            --overwrite

          echo "Recorded tag ${IMAGE_TAG} at ${PARAMETER_NAME}"

      - name: Build Summary
        if: always()
        env:
          IMAGE_REF: ${{ steps.ecr_login.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ env.image_tag }}
          IMAGE_DIGEST: ${{ steps.docker_build.outputs.digest }}
          PARAMETER_NAME: ${{ vars.AWS_SSM_IMAGE_TAG_PARAMETER }}
          PARAMETER_OUTCOME: ${{ steps.publish_image_tag.outcome }}
        run: |
          {
            echo "### Explorer image"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Tag | \`${IMAGE_TAG}\` |"
            echo "| Image | \`${IMAGE_REF}:${IMAGE_TAG}\` |"
            echo "| Digest | \`${IMAGE_DIGEST:-(not built)}\` |"
            echo "| Tag parameter | \`${PARAMETER_NAME:-(unset)}\` (${PARAMETER_OUTCOME:-skipped}) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${IMAGE_DIGEST}" ]; then
            echo "::notice title=Image tag::${IMAGE_TAG}"
          fi
